name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hartsystem
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hartsystem"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hartsystem
      PORT: 4000
      VITE_API_BASE_URL: http://localhost:4000/api/v1
      # The web build hard-fails without a publishable key (see apps/web/vite.config.ts).
      # A syntactically valid dummy is enough — nothing here talks to Clerk.
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify the web bundle contains the app
        # A missing build-time env var can reduce main.tsx to an unconditional throw,
        # which the bundler then drops along with the entire app — a "successful"
        # build that ships a blank page. Assert real app code made it into the output.
        run: |
          if ! grep -rq "Total Assets" apps/web/dist/assets/*.js; then
            echo "::error::Web bundle is missing application code — check build-time env vars."
            exit 1
          fi
          echo "Web bundle contains application code."
